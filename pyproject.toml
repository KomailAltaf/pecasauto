[project]
name = "portugal-auto-validation-lab"
version = "0.1.0"
description = "Provider-independent automotive identity and fitment validation lab"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0,<9"]

[tool.unittest]
test-directory = "tests"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "apps/api/tests"]
