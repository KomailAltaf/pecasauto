services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pecasauto_cms
      POSTGRES_USER: pecasauto
      POSTGRES_PASSWORD: pecasauto_local
    ports:
      - "5432:5432"
    volumes:
      - pecasauto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pecasauto -d pecasauto_cms"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pecasauto_postgres:
